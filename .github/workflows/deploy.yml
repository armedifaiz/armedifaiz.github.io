name: Deploy to Cloudflare Worker Assets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-data-updated]

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cf-worker-assets"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub projects
        run: node scripts/fetch-projects.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Credly badges
        run: node scripts/fetch-credly-badges.js

      - name: Fetch portfolio data (photos, certificates)
        run: node scripts/fetch-portfolio-data.js

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Worker Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd ./
          npm i --no-save wrangler@4
          npx wrangler deploy
